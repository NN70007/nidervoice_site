<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NiderVoice</title>
<meta name="description" content="NiderVoice">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1a2c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  :root { --fond: #ffffff; --encre-2: #5b6470; --trait: #e6e8ec; --lien: #0C447C; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --fond: #0b1a2c; --encre-2: #a9b4c2; --trait: #22344a; --lien: #85B7EB; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fond);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; text-align: center; }
  .logo { width: min(460px, 82vw); height: auto; }
  .logo-sombre { display: none; }
  @media (prefers-color-scheme: dark) { .logo-clair { display: none; } .logo-sombre { display: block; } }
  .contact { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .contact span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-2); }
  .contact a { font-size: 18px; color: var(--lien); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s; }
  .contact a:hover, .contact a:focus-visible { border-bottom-color: currentColor; outline: none; }
  footer { border-top: 1px solid var(--trait); padding: 18px 0 22px; text-align: center; font-size: 13px; color: var(--encre-2); }
</style>
</head>
<body>
<main>
  <h1 style="margin:0">
    <img class="logo logo-clair" src="assets/nidervoice-logo.svg" alt="NiderVoice" width="460" height="101">
    <img class="logo logo-sombre" src="assets/nidervoice-logo-sombre.svg" alt="NiderVoice" width="460" height="101">
  </h1>
  <p class="contact">
    <span>Contact</span>
    <a href="mailto:contact@nidervoice.com">contact@nidervoice.com</a>
  </p>
</main>
<footer>© 2026 NiderLabs</footer>
</body>
</html>
