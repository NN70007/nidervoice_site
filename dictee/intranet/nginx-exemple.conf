# NiderVoice Dictée, version intranet : exemple pour nginx (à adapter : nom du serveur, certificat, accès).
# HTTPS obligatoire (le navigateur refuse le micro sans HTTPS). Seules les lectures (GET, HEAD) sont acceptées.
server {
    listen 443 ssl;
    server_name dictee.intranet.exemple;
    ssl_certificate     /etc/ssl/certs/dictee.pem;
    ssl_certificate_key /etc/ssl/private/dictee.key;

    root /srv/nidervoice-dictee;
    index index.html;
    autoindex off;
    limit_except GET HEAD { deny all; }

    types { application/wasm wasm; text/javascript js mjs; font/woff2 woff2; image/svg+xml svg; text/css css; text/html html; application/json json; application/octet-stream bin; }

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Le modèle est chiffré ; restreindre en plus l'accès au site selon les règles de l'établissement
    # (par exemple auth_basic, authentification de l'annuaire, ou réseau autorisé : allow 10.0.0.0/8; deny all;).
}
